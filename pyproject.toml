[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-optimizer"
version = "0.1.0"
description = "Autonomous GPU kernel optimization: RL + evolutionary search + learned performance models over real Triton kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunkalp Chandra" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
gpu = ["triton>=2.1"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = { find = { include = ["optimizer*", "compiler*", "benchmarks*", "hardware*", "server*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E741",   # ambiguous single-letter names: m/l are idiomatic in kernel math
    "RUF001", # unicode multiplication signs are intentional in user-facing strings
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments (e.g. the reward formula's real minus sign)
    "B905",   # zip strict= everywhere adds noise; lengths are structurally equal here
]

[tool.ruff.lint.per-file-ignores]
"compiler/triton/kernels.py" = ["F821"]  # tl.constexpr names resolve at Triton JIT time
